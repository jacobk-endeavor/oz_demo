# Oz runtime configuration
# Read by backend/oz/ozConfig.ts on every chat request (no restart needed
# between edits — the loader caches by mtime and re-reads on change).
#
# chat.runtime selects which chat backend handles /api/oz/chat:
#   scaffold = hardcoded sequence (search_transcripts → read_transcript →
#              kb_search, templated reply). Deterministic, no API costs, ~50ms.
#   agentic  = LLM-driven tool-use loop with the same OzToolSurface tools.
#              Provider auto-picked from whichever API key is set.
#
# chat.agentic.provider:
#   auto      = use OPENAI_API_KEY if set, else fall back to ANTHROPIC_API_KEY.
#   openai    = force OpenAI Chat Completions (gpt-4o-mini default).
#   anthropic = force Anthropic Messages API (claude-sonnet-4-6 default).
#
# chat.agentic.model is optional; provider's default is used if omitted.
# Per-tab UI toggle in the bottom-right of the app overrides chat.runtime
# for the current browser session.

chat:
  runtime: scaffold
  agentic:
    provider: auto
    # model: gpt-4o-mini             # OpenAI override
    # model: claude-sonnet-4-6       # Anthropic override

# Python sandbox (run_python): pin the oz-sandbox image by registry digest after CI push
# (.github/workflows/oz-sandbox-image.yml prints IMAGE@sha256:… on main). Rollback = bump digest.
# sandbox:
#   imageDigest: "sha256:…"

# Chat artifact storage (DigitalOcean Spaces): optional presigned GET lifetime in seconds.
# Override with env OZ_SPACES_SIGNED_URL_TTL_SECONDS when set.
# artifacts:
#   signedUrlTtlSeconds: 3600
