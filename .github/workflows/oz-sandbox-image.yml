# Build oz-sandbox (see sandbox/Dockerfile). On main, push to GHCR and record digest
# in CI logs; pin that digest in config/oz.yaml as sandbox.imageDigest (docs §6.3, §11.4).
name: Oz sandbox image

on:
  push:
    branches: [main]
    paths:
      - "sandbox/**"
      - ".github/workflows/oz-sandbox-image.yml"
  pull_request:
    paths:
      - "sandbox/**"
      - ".github/workflows/oz-sandbox-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Image name (GHCR, lowercase)
        run: |
          echo "IMAGE_REF=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')/oz-sandbox" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ./sandbox
          file: ./sandbox/Dockerfile
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ${{ env.IMAGE_REF }}:${{ github.sha }}
            ${{ env.IMAGE_REF }}:latest
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Report digest for pinning (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          echo "Image reference with digest (pin in config/oz.yaml or secrets):"
          echo "${{ env.IMAGE_REF }}@${{ steps.build.outputs.digest }}"
