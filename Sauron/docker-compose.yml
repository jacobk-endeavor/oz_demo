services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sauron
      POSTGRES_PASSWORD: sauron
      POSTGRES_DB: sauron
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://sauron:sauron@db:5432/sauron
    depends_on:
      - db
    volumes:
      - ./backend:/app
    command: uv run uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  pgdata:
