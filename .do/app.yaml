# DigitalOcean App Platform — single Web Service serves the Vite app and /api/* proxies
# (ElevenLabs TTS, OpenAI, etc.). Do not add a separate static site that only serves dist/;
# /api/oz/elevenlabs/tts must hit this same service.
#
# Set in the control panel (or add encrypted envs here): ELEVENLABS_API_KEY, OPENAI_API_KEY, etc.
# Voice (POST /api/oz/elevenlabs/tts) calls ElevenLabs; use enough RAM/CPU that Node isn’t OOM
# or starved (otherwise App Platform can return 503 “via_upstream / connection_timed_out”).
# Docs: https://docs.digitalocean.com/products/app-platform/reference/app-spec/

alerts:
  - rule: DEPLOYMENT_FAILED
  - rule: DOMAIN_FAILED

features:
  - buildpack-stack=ubuntu-22

name: oz-demo
region: nyc

services:
  - name: web
    environment_slug: node-js
    github:
      repo: jacobk-endeavor/oz_demo
      branch: main
      deploy_on_push: true
    source_dir: /
    # Frontend bundle + Python venv for Knowledge Base upload → ingest_kb.py (POST /api/oz/knowledge-base/ingest).
    # Requires python3 on the build image (Ubuntu buildpack includes it). Set SKIP_KB_INGEST_SETUP=1 to skip venv.
    build_command: npm run build && bash scripts/deploy-setup-kb-ingest.sh
    run_command: npm start
    http_port: 8080
    instance_count: 1
    # Was basic-xxs; next tier up reduces OOM/stall risk for vite preview + TTS proxy.
    instance_size_slug: basic-xs
    health_check:
      http_path: /
      initial_delay_seconds: 15
      period_seconds: 10
      timeout_seconds: 10
      failure_threshold: 5
    # Encrypted at rest in the App Platform UI (do not commit values):
    #   DO_SPACES_KEY, DO_SPACES_SECRET — Spaces access key pair for S3-compatible API
    #   DO_SPACES_ENDPOINT — e.g. https://nyc3.digitaloceanspaces.com (match bucket region)
    #   DO_SPACES_REGION — e.g. nyc3
    #   DO_SPACES_BUCKET — e.g. oz-artifacts-prod (one per env; see docs/infra/oz-artifacts-spaces.md, design §6.3)
    envs:
      - key: NODE_ENV
        value: production
        scope: RUN_AND_BUILD_TIME
        type: GENERAL
